<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中打練習</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            color: #333;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
            color: #fff;
            padding: 10px 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.5);
            cursor: pointer; /* 讓標題顯示成可點擊 */
        }
        .header h1 {
            margin: 0;
            padding-left: 20px;
            font-size: 30px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }
        .keyboard-status {
            padding-right: 20px;
            font-size: 18px;
            color: #fff;
        }
        .setup-area, .practice-area {
            margin: 80px auto 20px auto;
            width: 90%;
            max-width: 800px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.2);
            padding: 20px; 
            display: none;
        }
        .setup-area.active, .practice-area.active {
            display: block;
        }

@font-face {
    font-family: 'ㄅ注音芫荽 Regular';
    src: url('https://kentxchang-goedutw.github.io/web/BpmfIansui-Regular_0.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
}

.letter-display {
    font-size: 64px;
    font-weight: bold;
    color: #ff6f61;
    margin-bottom: 10px; 
    text-shadow: 3px 3px 6px #fbb1bd;
    font-family: 'ㄅ注音芫荽 Regular', sans-serif; /* 設置字型 */
}

        .translation-display {
            font-size: 32px;
            color: #28a745;
            margin-top: 10px;
        }
        input[type="text"] {
            width: 95%;
            padding: 15px; 
            font-size: 32px;
            text-align: center;
            border-radius: 10px;
            border: 2px solid #ddd;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            margin-bottom: 10px;
        }
        input[type="text"]:focus {
            border-color: #ff6f61;
            box-shadow: 0 0 10px #ff6f61;
        }
        .feedback {
            font-size: 28px;
            height: 30px;
        }
        .correct {
            color: #28a745;
            text-shadow: 2px 2px 4px #28a745;
        }
        .incorrect {
            color: #dc3545;
            text-shadow: 2px 2px 4px #dc3545;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .timer, .score, .feedback {
            flex: 1;
        }
        .timer {
            font-size: 24px;
            color: #666;
            text-align: right;
        }
        .score {
            font-size: 28px;
            color: #ff6f61;
            text-shadow: 2px 2px 4px #fbb1bd;
            text-align: left;
        }
        .control-buttons {
            margin: 10px 0;
        }
        .control-buttons button {
            padding: 12px 24px;
            font-size: 20px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            background-color: #007BFF;
            color: #fff;
            cursor: pointer;
            transition: border 0.3s, background-color 0.3s, box-shadow 0.3s;
        }
        .control-buttons button.selected {
            border: 3px solid #ff6f61;
        }
        .control-buttons button.current-word {
            border: 3px solid red;
        }
        .control-buttons button:hover {
            background-color: #0056b3;
            box-shadow: 0 0 10px #0056b3;
        }
        .start-button {
            padding: 15px 30px;
            font-size: 24px;
            border-radius: 10px;
            background-color: #ff6f61;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s, box-shadow 0.3s;
            margin-top: 20px;
        }
        .start-button:hover {
            background-color: #e65b50;
            box-shadow: 0 0 15px #e65b50;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }
        .overlay-content {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .overlay-content h2 {
            font-size: 40px;
            margin-bottom: 20px;
            color: #ff6f61;
            text-shadow: 2px 2px 4px #fbb1bd;
        }
        .overlay-content p {
            font-size: 54px;
            color: #dc3545;
            font-weight: bold;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px #fbb1bd;
        }
        .overlay-content button {
            padding: 12px 24px;
            font-size: 26px;
            border-radius: 10px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .overlay-content button:hover {
            background-color: #0056b3;
            box-shadow: 0 0 10px #0056b3;
        }
        .footer {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 16px;
            color: #333;
        }
        .footer a {
            color: #007BFF;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }

        /* 新增的透明區域樣式 */
        .switch-area {
            position: fixed;
            bottom: 10px;
            left: 10px;
            width: 50px;
            height: 50px;
            background-color: rgba(0, 0, 0, 0); /* 透明 */
            cursor: pointer;
        }

        /* 自訂國字生詞練習畫面的樣式 */
        .custom-word-area {
            display: none;
            margin: 100px auto;
            width: 90%;
            max-width: 800px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.2);
            padding: 20px;
            text-align: center;
        }
        .custom-word-area h2 {
            font-size: 24px;
            color: #ff6f61;
        }
        .custom-word-area textarea {
            width: 95%;
            height: 150px;
            padding: 15px;
            font-size: 16px;
            margin: 20px 0;
            border-radius: 10px;
            border: 2px solid #ddd;
            text-align: left;
            resize: none;
        }
        .custom-word-area button {
            padding: 10px 20px;
            font-size: 20px;
            border-radius: 10px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .custom-word-table-container {
            margin-top: 20px;
        }
        .custom-word-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .custom-word-table {
            width: 100%;
            max-height: 300px;
            overflow-y: scroll;
            border-collapse: collapse;
            font-size: 12px;
        }
        .custom-word-table th, .custom-word-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .custom-word-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header" onclick="loadWordListFromFile()"> <!-- 點擊標題觸發 -->
        <h1>中打練習</h1>
        <div class="keyboard-status">切換到中文輸入法</div>
    </div>

    <!-- 設定區域 -->
    <div class="setup-area active" id="setupArea">
        <h2>國字生詞列表</h2>
        <div class="control-buttons order" id="questionButtons">
            <!-- 這裡將動態生成按鈕 -->
        </div>
        <div class="control-buttons time">
            <h3>選擇練習時間：</h3>
            <button onclick="setPracticeTime(1, this)">1 分鐘</button>
            <button onclick="setPracticeTime(3, this)" class="selected">3 分鐘</button>
            <button onclick="setPracticeTime(5, this)">5 分鐘</button>
        </div>
        <button class="start-button" onclick="startPractice()">開始練習</button>
    </div>

    <!-- 練習區域 -->
    <div class="practice-area" id="practiceArea">
        <div class="status-bar">
            <div class="score" id="score">分數: 0</div>
            <div class="feedback" id="feedback"></div>
            <div class="timer" id="timer">Time: 0s</div>
        </div>
        <div class="letter-display" id="letterDisplay"></div>
        <div class="translation-display" id="translationDisplay"></div>
        <input type="text" id="inputBox" autofocus />
        <!-- 顯示按鈕在輸入框下方 -->
        <div class="control-buttons order" id="practiceButtons"></div>
    </div>

    <div class="overlay" id="scoreOverlay">
        <div class="overlay-content">
            <h2 id="practiceTimeText">此次練習時間: 3 分鐘</h2>
            <p id="finalScore">分數: 0</p>
            <button onclick="restartPractice()">重新開始</button>
        </div>
    </div>

    <div class="footer">
        Made by <a href="https://kentxchang.blogspot.tw" target="_blank">阿剛老師</a>
    </div>

    <!-- 新增的透明區域 -->
    <div class="switch-area" onclick="switchToCustomWordArea()"></div>

    <!-- 自訂國字生詞練習區域 -->
    <div class="custom-word-area" id="customWordArea">
        <h2>自訂練習用國字生詞</h2>
        <textarea id="customWordInput">肩膀
膝蓋
腳趾
眼
耳
鼻
口
手臂
手腕
大腿
小腿
屁股
頭 
彎
直
壓
畫圓
轉
放
反方向 
動作加快 
</textarea>
        <button onclick="submitCustomWord()">送出</button>
        <div class="custom-word-table-container">
            <div id="customWordTitle" class="custom-word-title"></div>
            <table class="custom-word-table" id="customWordTable"></table>
        </div>
    </div>

    <script>
        let currentWordList = [];
        let currentWord = "";
        let currentTranslation = "";
        let startTime;
        let interval;
        let practiceTime = 3;
        let score = 0;
        let wordIndex = 0;
        let timerStarted = false;
        let hasLoaded = false; // 用於標記是否已載入txt

        function startPractice() {
            if (currentWordList.length === 0) {
                alert("沒有可練習的內容，請先自訂練習內容或載入題庫！");
                return;
            }
            document.getElementById("setupArea").style.display = "none"; // 隱藏 .setup-area 區域
            document.getElementById("practiceArea").style.display = "block"; // 顯示 .practice-area 區域
            document.getElementById("inputBox").focus();
            score = 0;
            wordIndex = 0;
            timerStarted = true; // 開始計時
            document.getElementById("score").innerText = `分數: ${score}`;
            document.getElementById("timer").innerText = `Time: 0s`; // 重置時間顯示
            shuffleWords(); // 隨機排序單字
            updateWord();
            displayButtonsInPractice(); // 顯示按鈕在練習區域
            startTimer(); // 按下「開始練習」後立即開始計時
            highlightCurrentWordButton(currentWord); // 第一題的按鈕加上紅色粗框
        }

        function setPracticeTime(minutes, button) {
            practiceTime = minutes;
            updateSelectedButton(button, 'time');
        }

        function updateSelectedButton(button, group) {
            const buttons = document.querySelectorAll(`.control-buttons.${group} button`);
            buttons.forEach(btn => btn.classList.remove('selected'));
            button.classList.add('selected');
        }

        function startTimer() {
            startTime = new Date();
            interval = setInterval(() => {
                const elapsedTime = Math.floor((new Date - startTime) / 1000);
                const remainingTime = practiceTime * 60 - elapsedTime;
                if (remainingTime <= 0) {
                    stopTimer();
                    showScoreOverlay();
                } else {
                    document.getElementById("timer").innerText = `Time: ${remainingTime}s`;
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(interval);
        }

        function resetFeedback() {
            const feedbackElement = document.getElementById("feedback");
            feedbackElement.innerText = "";
            feedbackElement.className = "feedback";
            document.getElementById("inputBox").value = "";
        }

        function shuffleWords() {
            for (let i = currentWordList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentWordList[i], currentWordList[j]] = [currentWordList[j], currentWordList[i]];
            }
        }

        function getNextWord() {
            wordIndex = (wordIndex + 1) % currentWordList.length;
            return currentWordList[wordIndex];
        }

        function updateWord() {
            const nextWordObject = getNextWord();
            currentWord = nextWordObject.word;
            currentTranslation = nextWordObject.translation;
            document.getElementById("letterDisplay").innerText = currentWord;
            if (currentTranslation) {
                document.getElementById("translationDisplay").innerText = `(${currentTranslation})`;
            } else {
                document.getElementById("translationDisplay").innerText = '';
            }
            highlightCurrentWordButton(currentWord);
        }

        function checkInput() {
            const input = document.getElementById("inputBox").value.toLowerCase();
            const normalizedWord = currentWord.toLowerCase(); // 將 currentWord 轉為小寫

            if (input === normalizedWord) { // 比對時使用小寫的 input 和 normalizedWord
                score += currentWord.length * 5 + 20;
                document.getElementById("score").innerText = `分數: ${score}`;
                resetFeedback();
                updateWord();
            } else {
                resetFeedback();
            }
        }

        // 顯示按鈕在練習區域
        function displayButtonsInPractice() {
            const practiceButtonsContainer = document.getElementById("practiceButtons");
            practiceButtonsContainer.innerHTML = '';
            currentWordList.forEach(wordObj => {
                if (wordObj.word.trim()) { // 如果有標題且不是空白，才生成按鈕
                    const button = document.createElement("button");
                    button.textContent = wordObj.word.trim();
                    button.className = "control-buttons";
                    practiceButtonsContainer.appendChild(button);
                }
            });
        }

        // 高亮當前單字按鈕
        function highlightCurrentWordButton(currentWord) {
            const practiceButtonsContainer = document.getElementById("practiceButtons");
            const buttons = practiceButtonsContainer.getElementsByTagName("button");
            Array.from(buttons).forEach(button => {
                if (button.textContent === currentWord) {
                    button.classList.add('current-word');
                } else {
                    button.classList.remove('current-word');
                }
            });
        }

        // 在輸入框中按下鍵盤的事件處理器
        document.getElementById("inputBox").addEventListener("keyup", function(event) {
            if (event.key === 'Enter') { // 檢查是否按下了 Enter 鍵
                checkInput(); // 觸發比對
            }
        });

        function showScoreOverlay() {
            document.getElementById("finalScore").innerText = `分數: ${score}`;
            document.getElementById("practiceTimeText").innerText = `此次練習時間: ${practiceTime} 分鐘`;
            document.getElementById("scoreOverlay").style.display = "flex";
        }

        function restartPractice() {
            document.getElementById("scoreOverlay").style.display = "none";
            document.getElementById("practiceArea").classList.remove("active");
            document.getElementById("setupArea").style.display = "block"; // 顯示 .setup-area 區域
            window.onload(); // 重新載入初始畫面內容
        }

        // 切換到自訂單字練習畫面
        function switchToCustomWordArea() {
            document.getElementById("setupArea").style.display = "none";
            document.getElementById("practiceArea").style.display = "none";
            document.getElementById("customWordArea").style.display = "block";
        }

        // 送出自訂單字並生成題目按鈕
        function submitCustomWord() {
            processCustomWord(document.getElementById("customWordInput").value);

            // 返回 "開始練習" 畫面
            document.getElementById("setupArea").style.display = "block";
            document.getElementById("customWordArea").style.display = "none"; // 保持自訂區塊隱藏
        }

        // 處理自訂單字輸入
        function processCustomWord(customWordInput) {
            const lines = customWordInput.split('\n').filter(line => line.trim() !== ''); // 確保沒有空白行
            if (lines.length < 1) { // 確保至少有一個詞語
                alert("請至少輸入一個有效的國字生詞！");
                return;
            }

            const dataLines = lines; // 每一行都是題目
            const table = document.getElementById("customWordTable");
            const questionButtons = document.getElementById("questionButtons");

            // 更新網頁標題
            document.title = `自訂中打練習`;

            // 顯示表格標題
            document.getElementById("customWordTitle").textContent = "自訂單字列表";

            table.innerHTML = ''; // 清空表格
            questionButtons.innerHTML = ''; // 清空按鈕

            currentWordList = [];

            dataLines.forEach(line => {
                let [english, chinese] = line.split(/[\t,]/).map(item => item.trim());

                // 如果第一欄沒有內容，跳過該行
                if (!english) {
                    return;
                }

                // 如果第二欄沒資料，填入空白
                if (!chinese) {
                    chinese = '';
                }

                // 將每行添加到題目列表中
                currentWordList.push({ word: english, translation: chinese });

                // 動態生成按鈕
                const button = document.createElement("button");
                button.textContent = english;
                button.className = "control-buttons";
                button.onclick = () => selectWord(english);
                questionButtons.appendChild(button);

                // 生成表格
                const row = table.insertRow();
                const cell1 = row.insertCell(0);
                const cell2 = row.insertCell(1);
                cell1.textContent = english;
                cell2.textContent = chinese;
            });

            // 隨機選擇一個按鈕並預選
            if (currentWordList.length > 0) {
                const randomIndex = Math.floor(Math.random() * currentWordList.length);
                currentWord = currentWordList[randomIndex].word;
                updateWord();
            }
        }

        function selectWord(word) {
            currentWord = word;
            updateWord();
        }

        // 預填內容後自動送出
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const textParam = urlParams.get('data');
            if (textParam) {
                processCustomWordFromURL(textParam);
            } else {
                processCustomWord(document.getElementById("customWordInput").value);
            }
        };

        function processCustomWordFromURL(textParam) {
            const words = textParam.split(',').map(word => word.trim()).filter(word => word !== '');
            const title = '自訂練習'; // 預設標題
            const table = document.getElementById("customWordTable");
            const questionButtons = document.getElementById("questionButtons");

            // 更新網頁標題
            document.title = `${title} 國字打字練習`;

            // 顯示表格標題
            document.getElementById("customWordTitle").textContent = title;

            table.innerHTML = ''; // 清空表格
            questionButtons.innerHTML = ''; // 清空按鈕

            currentWordList = [];

            words.forEach(word => {
                currentWordList.push({ word: word, translation: '' });

                const button = document.createElement("button");
                button.textContent = word;
                button.className = "control-buttons";
                button.onclick = () => selectWord(word);
                questionButtons.appendChild(button);

                const row = table.insertRow();
                const cell1 = row.insertCell(0);
                const cell2 = row.insertCell(1);
                cell1.textContent = word;
                cell2.textContent = ''; // 翻譯欄位留空
            });

            if (currentWordList.length > 0) {
                const randomIndex = Math.floor(Math.random() * currentWordList.length);
                currentWord = currentWordList[randomIndex].word;
                updateWord();
            }
        }

        // 從詞語題庫.txt載入內容，只能使用一次
        function loadWordListFromFile() {
            if (hasLoaded) {
                return; // 已經載入過，退出
            }

            const randomQuery = `?v=${Math.random()}`;

            fetch(`詞語題庫.txt${randomQuery}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('No 詞語題庫.txt file found');
                    }
                    return response.text();
                })
                .then(data => {
                    const input = document.getElementById('customWordInput');
                    input.value = data; 
                    submitCustomWord(); 
                    hasLoaded = true; 
                })
                .catch(error => {
                    console.log('Could not load 詞語題庫.txt:', error);
                });
        }
    </script>
</body>
</html>
